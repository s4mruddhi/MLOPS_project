seed: 42

ingestion:
  n_samples: 2500
  raw_data_path: "data/raw/customer_churn.csv"

preprocessing:
  test_size: 0.20
  numerical_scaling: "StandardScaler"
  categorical_encoding: "OneHotEncoder"
  processed_data_path: "data/processed/churn_processed.csv"

train:
  quality_gate:
    min_accuracy: 0.80
    min_f1: 0.75
    min_roc_auc: 0.82
  models:
    logistic_regression:
      max_iter: 1000
    random_forest:
      n_estimators: 100
      max_depth: 8
    gradient_boosting:
      n_estimators: 100
      learning_rate: 0.1
      max_depth: 5

rag:
  chunking:
    chunk_size: 400
    chunk_overlap: 80
